<div class="flex align-middle mx-auto h-screen">
  <div class="flex flex-col mx-auto">
    <h1 class="text-center uppercase my-32 underline underline-offset-8">Rocks paper scissors</h1>

    <div *ngIf="game">
      <!-- <pre>{{ game | json }}</pre> -->

      <!-- Game fairness -->
      <div class="my-16">
        <game-fairness [game]="game"></game-fairness>
      </div>

      <!-- Buttons for user guess -->
      <div class="flex flex-col" *ngIf="game.state === 'prepare'">
        <button class="btn btn-gray btn-xl mt-4" (click)="play('rock')">{{ 'rock' | guessName }}</button>
        <button class="btn btn-gray btn-xl mt-4" (click)="play('paper')">{{ 'paper' | guessName }}</button>
        <button class="btn btn-gray btn-xl mt-4" (click)="play('scissors')">{{ 'scissors' | guessName }}</button>
      </div>

      <!-- Game result -->
      <ng-container *ngIf="game.state === 'settle'">
        <!-- User guess -->
        <p class="text-2xl">You chose {{ game.userGuess | guessName }}</p>

        <!-- Computer guess -->
        <p class="text-2xl">Computer chose {{ game.computerGuess | guessName }}</p>

        <!-- Result -->
        <div class="text-3xl text-center mt-6">
          <strong>
            <ng-container [ngSwitch]="game.result">
              <ng-template ngSwitchCase="win"> You win! </ng-template>
              <ng-template ngSwitchCase="lose"> You lose! </ng-template>
              <ng-template ngSwitchCase="draw"> Draw! </ng-template>
            </ng-container>
          </strong>
        </div>
      </ng-container>
    </div>

    <button class="btn btn-gray btn-xl mt-4" *ngIf="!game || game.state === 'settle'" (click)="prepareGame()">
      Play again
    </button>
  </div>
</div>
